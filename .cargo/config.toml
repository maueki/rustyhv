[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
runner = ["qemu-system-aarch64", "-machine", "virt,virtualization=on", "-cpu", "cortex-a57", "-accel", "tcg", "-smp", "1", "-m", "128M", "-display", "none", "-serial", "stdio", "-monitor", "none", "-nic", "none", "-kernel"]
